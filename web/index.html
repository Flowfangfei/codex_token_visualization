<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Token Ledger</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232d2822'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-size='20' font-family='Georgia' font-weight='700' fill='%23f7f0e6'%3EAI%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="mark" aria-hidden="true">AI</div>
          <div>
            <p class="eyebrow">Local Agent Usage</p>
            <h1>AI Token Ledger</h1>
          </div>
        </div>
        <div class="toolbar" aria-label="操作">
          <button class="icon-button" id="refreshBtn" type="button" title="导出当前视图并刷新" aria-label="导出当前视图并刷新">
            <span aria-hidden="true">↻</span>
          </button>
          <button class="primary-button" id="exportBtn" type="button">
            <span aria-hidden="true">⬇</span>
            <span>全部导出</span>
          </button>
        </div>
      </header>

      <main>
        <nav class="view-tabs" aria-label="页面视图">
          <button class="view-tab is-active" type="button" data-view="overview">总览</button>
          <button class="view-tab" type="button" data-view="codex">Codex</button>
          <button class="view-tab" type="button" data-view="claude">Claude Code</button>
          <button class="view-tab" type="button" data-view="sources">数据源</button>
        </nav>

        <section class="status-strip" aria-live="polite">
          <div>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">正在读取本地 JSON...</span>
          </div>
          <div class="source-path" id="sourcePath">codex-usage-logs/daily</div>
        </section>

        <section class="metric-grid" id="metricGrid"></section>

        <section class="source-compare" id="sourceCompare"></section>

        <section class="layout-grid" id="detailGrid">
          <article class="panel trend-panel">
            <div class="panel-heading">
              <div>
                <p class="section-label" id="trendLabel">Daily Trend</p>
                <h2 id="trendTitle">最近使用量</h2>
              </div>
              <div class="pill" id="rangePill">--</div>
            </div>
            <div class="chart-wrap" id="trendChart"></div>
          </article>

          <article class="panel split-panel">
            <div class="panel-heading">
              <div>
                <p class="section-label" id="breakdownLabel">Latest Day</p>
                <h2 id="breakdownTitle">Token 构成</h2>
              </div>
              <div class="pill" id="latestDatePill">--</div>
            </div>
            <div id="breakdown"></div>
          </article>
        </section>

        <section class="reset-panel" id="resetCredits" aria-live="polite">
          <div class="reset-copy">
            <p class="section-label">Rate-limit resets</p>
            <h2>重置额度</h2>
            <p id="resetSummary">正在读取可用重置额度...</p>
          </div>
          <div class="reset-list" id="resetCreditList"></div>
        </section>

        <section class="layout-grid lower-grid" id="lowerGrid">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="section-label" id="modelsLabel">Models</p>
                <h2>模型分布</h2>
              </div>
            </div>
            <div class="model-list" id="modelList"></div>
          </article>

          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="section-label">Snapshots</p>
                <h2>本地快照</h2>
              </div>
              <div class="pill" id="fileCountPill">0 files</div>
            </div>
            <div class="snapshot-list" id="snapshotList"></div>
          </article>
        </section>

        <section class="panel table-panel" id="tablePanel">
          <div class="panel-heading">
            <div>
              <p class="section-label">Ledger</p>
              <h2 id="tableTitle">每日明细</h2>
            </div>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  <th>总 Token</th>
                  <th>非缓存输入</th>
                  <th>缓存读取</th>
                  <th>缓存写入</th>
                  <th>输出</th>
                  <th>推理输出</th>
                  <th>费用估算</th>
                  <th>模型</th>
                </tr>
              </thead>
              <tbody id="dailyRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <template id="metricTemplate">
      <article class="metric-card">
        <div class="metric-label"></div>
        <div class="metric-value"></div>
        <div class="metric-sub"></div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
